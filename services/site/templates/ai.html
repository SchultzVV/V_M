<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEF — Assistente</title>
  <link rel="stylesheet" href="/static/def-design.css" />
  <style>
    /* ── Chat layout ── */
    .chat-wrap {
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .chat-intro {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--gray-text);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border-left: 2px solid var(--neon-green);
      padding-left: 0.75rem;
    }

    /* ── Messages ── */
    #chat-messages {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 160px;
    }

    .msg {
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }

    .msg-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
      padding-top: 0.15rem;
      min-width: 3rem;
    }

    .msg.user .msg-label { color: var(--neon-green); }
    .msg.bot  .msg-label { color: var(--neon-red); }

    .msg-bubble {
      background: var(--dark-gray);
      border: 1px solid var(--gray-steel);
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      line-height: 1.6;
      flex: 1;
    }

    .msg.user .msg-bubble { border-color: var(--gray-mid); }
    .msg.bot  .msg-bubble { border-color: var(--gray-steel); }

    /* ── Product cards inline ── */
    .product-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1px;
      background: var(--gray-steel);
      margin-top: 0.75rem;
    }

    .mini-card {
      background: var(--black-deep);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .mini-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
    }

    .mini-card .mc-title {
      font-size: 0.75rem;
      line-height: 1.4;
      color: var(--gray-light);
      font-family: var(--font-sans);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-card .mc-price {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--neon-green);
      margin-top: auto;
    }

    .mini-card .mc-old {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--gray-text);
      text-decoration: line-through;
    }

    .mini-card a.mc-link {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--neon-red);
      border: 1px solid var(--neon-red);
      padding: 0.35rem 0.5rem;
      text-align: center;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    .mini-card a.mc-link:hover {
      background: var(--neon-red);
      color: var(--black-deep);
    }

    /* ── Typing indicator ── */
    .typing .msg-bubble::after {
      content: '▋';
      animation: blink 0.8s step-end infinite;
      color: var(--neon-green);
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Input bar ── */
    .chat-input-bar {
      display: flex;
      gap: 0;
      border: 1px solid var(--gray-steel);
      background: var(--dark-gray);
    }

    .chat-input-bar:focus-within {
      border-color: var(--neon-green);
    }

    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.85rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--gray-light);
    }

    #chat-input::placeholder { color: var(--gray-text); }

    #send-btn {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: var(--neon-green);
      color: var(--black-deep);
      border: none;
      padding: 0 1.25rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #send-btn:hover   { background: var(--neon-green-dim); }
    #send-btn:disabled {
      background: var(--gray-steel);
      color: var(--gray-text);
      cursor: not-allowed;
    }

    /* ── Suggestions ── */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .suggestion-chip {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid var(--gray-steel);
      background: transparent;
      color: var(--gray-text);
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .suggestion-chip:hover {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="def-hero">
    <div class="def-hero-row">
      <h1 class="def-logo"><a href="/"><span class="accent">DEF</span><span class="dot">.</span></a></h1>
      <p class="def-tagline">Assistente — <span class="hostile">Pergunte sobre nossos produtos</span></p>
    </div>
  </header>

  <!-- ── Nav ── -->
  <div class="def-catalogue" style="padding-bottom:0;">
    <nav class="nav-buttons">
      <button class="nav-btn" onclick="window.location.href='/'">Todos</button>
      <button class="nav-btn" onclick="window.location.href='/secao1'">Casa &amp; Decoração</button>
      <button class="nav-btn" onclick="window.location.href='/secao2'">Moda &amp; Estilo</button>
      <button class="nav-btn" onclick="window.location.href='/secao3'">Eletrônicos</button>
      <button class="nav-btn" onclick="window.location.href='/secao4'">PetShop</button>
      <button class="nav-btn" onclick="window.location.href='/secao5'">Esportes</button>
      <button class="nav-btn active" onclick="window.location.href='/ai/'">✦ Assistente</button>
    </nav>
  </div>

  <!-- ── Chat ── -->
  <div class="chat-wrap">

    <p class="chat-intro">Assistente DEF — pergunte sobre produtos, preços ou categorias</p>

    <div id="chat-messages">
      <!-- Mensagem inicial do bot -->
      <div class="msg bot">
        <span class="msg-label">DEF</span>
        <div class="msg-bubble">
          Olá! Sou o assistente da loja DEF. Posso te ajudar a encontrar produtos no nosso catálogo.<br/>
          Pergunte algo como: <em>"tem smartphones?"</em> ou <em>"quero uma ração para gato"</em>.
        </div>
      </div>
    </div>

    <!-- Sugestões rápidas -->
    <div class="suggestions" id="suggestions">
      <button class="suggestion-chip" onclick="sendSuggestion('Tem smartphones para vender?')">Smartphones</button>
      <button class="suggestion-chip" onclick="sendSuggestion('Quais produtos para pets vocês têm?')">Pets</button>
      <button class="suggestion-chip" onclick="sendSuggestion('Tem algo para a cozinha?')">Cozinha</button>
      <button class="suggestion-chip" onclick="sendSuggestion('Quais os produtos mais baratos?')">Mais baratos</button>
      <button class="suggestion-chip" onclick="sendSuggestion('Alguma promoção em roupas?')">Moda</button>
    </div>

    <!-- Input ── -->
    <div class="chat-input-bar">
      <input
        type="text"
        id="chat-input"
        placeholder="Pergunte sobre um produto..."
        autocomplete="off"
        maxlength="200"
      />
      <button id="send-btn" onclick="sendMessage()">Enviar</button>
    </div>

  </div>

  <script>
    const messagesEl = document.getElementById('chat-messages');
    const inputEl    = document.getElementById('chat-input');
    const sendBtn    = document.getElementById('send-btn');

    function scrollBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function appendMessage(role, text, products) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const label = document.createElement('span');
      label.className = 'msg-label';
      label.textContent = role === 'user' ? 'Você' : 'DEF';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      if (products && products.length > 0) {
        const row = document.createElement('div');
        row.className = 'product-row';
        products.forEach(p => {
          const card = document.createElement('div');
          card.className = 'mini-card';

          const img = document.createElement('img');
          const imgSrc = p.images && p.images[0] ? p.images[0] : '/static/default-image.jpg';
          img.src = imgSrc;
          img.alt = p.title;
          img.onerror = () => { img.src = '/static/default-image.jpg'; };

          const title = document.createElement('div');
          title.className = 'mc-title';
          title.textContent = p.title;

          const price = document.createElement('div');
          price.className = 'mc-price';
          price.textContent = p.price || '';

          const link = document.createElement('a');
          link.className = 'mc-link';
          link.href = `/produto/${p.id}`;
          link.textContent = 'Ver produto';

          card.appendChild(img);
          card.appendChild(title);
          card.appendChild(price);

          if (p.oldPrice && p.oldPrice !== p.price) {
            const old = document.createElement('div');
            old.className = 'mc-old';
            old.textContent = p.oldPrice;
            card.appendChild(old);
          }

          card.appendChild(link);
          row.appendChild(card);
        });
        bubble.appendChild(row);
      }

      wrap.appendChild(label);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollBottom();
      return wrap;
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      // Hide suggestions after first message
      document.getElementById('suggestions').style.display = 'none';

      inputEl.value = '';
      sendBtn.disabled = true;

      appendMessage('user', question);

      // Typing indicator
      const typingEl = document.createElement('div');
      typingEl.className = 'msg bot typing';
      typingEl.innerHTML = '<span class="msg-label">DEF</span><div class="msg-bubble"></div>';
      messagesEl.appendChild(typingEl);
      scrollBottom();

      try {
        const res = await fetch('/ai/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        typingEl.remove();
        appendMessage('bot', data.answer || data.error || 'Sem resposta.', data.products);
      } catch (err) {
        typingEl.remove();
        appendMessage('bot', 'Erro de conexão. Tente novamente.');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function sendSuggestion(text) {
      inputEl.value = text;
      sendMessage();
    }

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    inputEl.focus();
  </script>
</body>
</html>
