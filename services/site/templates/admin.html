<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Admin - Produtos</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: white;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #222;
    }

    th, td {
      padding: 12px;
      border: 1px solid #333;
      text-align: left;
    }

    button {
      padding: 6px 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c0392b;
    }

    h1 {
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Administração de Produtos</h1>
  <table id="product-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Preço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- produtos serão inseridos via JS -->
    </tbody>
  </table>

  <script>
    function fetchProducts() {
      fetch("/api/list_ids")
        .then(res => res.json())
        .then(data => {
          const tbody = document.querySelector("#product-table tbody");
          tbody.innerHTML = "";

          data.forEach(prod => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
              <td>${prod.id}</td>
              <td>${prod.title}</td>
              <td>${prod.price}</td>
              <td><button onclick="deleteProduct('${prod.id}', this)">Excluir</button></td>
            `;

            tbody.appendChild(tr);
          });
        });
    }

    function deleteProduct(id, btn) {
      if (!confirm("Tem certeza que deseja excluir este produto?")) return;

      fetch(`/api/delete/${id}`, {
        method: "DELETE"
      })
      .then(res => res.json())
      .then(result => {
        if (result.message) {
          btn.closest("tr").remove();
          alert("Produto excluído com sucesso.");
        } else {
          alert("Erro ao excluir produto: " + result.error);
        }
      });
    }

    // carrega ao abrir
    fetchProducts();
  </script>
</body>
</html>
