<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Meta Tags Otimizadas para SEO -->
  <title>{{ meta_tags.title if meta_tags else 'V&M - Lojinha' }}</title>
  <meta name="description" content="{{ meta_tags.description if meta_tags else 'As melhores promoções da internet' }}" />
  <meta name="keywords" content="{{ meta_tags.keywords if meta_tags else 'promoções, ofertas, descontos' }}" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{{ meta_tags['og:type'] if meta_tags else 'website' }}" />
  <meta property="og:title" content="{{ meta_tags['og:title'] if meta_tags else 'V&M - Lojinha' }}" />
  <meta property="og:description" content="{{ meta_tags['og:description'] if meta_tags else 'As melhores promoções' }}" />
  <meta property="og:image" content="{{ meta_tags['og:image'] if meta_tags else '/static/default-image.jpg' }}" />
  <meta property="og:url" content="{{ meta_tags['og:url'] if meta_tags else 'https://seusite.com' }}" />
  <meta property="og:site_name" content="{{ meta_tags['og:site_name'] if meta_tags else 'V&M' }}" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="{{ meta_tags['twitter:card'] if meta_tags else 'summary_large_image' }}" />
  <meta name="twitter:title" content="{{ meta_tags['twitter:title'] if meta_tags else 'V&M - Lojinha' }}" />
  <meta name="twitter:description" content="{{ meta_tags['twitter:description'] if meta_tags else 'As melhores promoções' }}" />
  <meta name="twitter:image" content="{{ meta_tags['twitter:image'] if meta_tags else '/static/default-image.jpg' }}" />
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://seusite.com/" />
  
  <!-- Schema.org Structured Data (JSON-LD) -->
  {% if organization_schema %}
  <script type="application/ld+json">
  {{ organization_schema | safe }}
  </script>
  {% endif %}
  
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .sort-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .sort-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .sort-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    
    .sort-btn.active {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
  </style>
</head>
<body>
  <!-- <h1>V&M</h1> -->
  <iframe src="/media/ping" style="display:none;" aria-hidden="true"></iframe>
  <div class="nav-buttons">
    <button class="nav-btn active" onclick="window.location.href='/'">✨ Todos</button>
    <button class="nav-btn" onclick="window.location.href='/secao1'">🏠 Casa & Decoração</button>
    <button class="nav-btn" onclick="window.location.href='/secao2'">👗 Moda & Estilo</button>
    <button class="nav-btn" onclick="window.location.href='/secao3'">📱 Eletrônicos</button>
    <button class="nav-btn" onclick="window.location.href='/secao4'">🐾 PetShop</button>
  </div>
  <p style="margin-top: 35px; font-weight: bold; font-size: 50px;">
    DEF
  </p>
  <p style="margin-top: 25px; font-weight: bold; font-size: 28px;">
    catálogo de sobrevivência pós-sistema! 😎
  </p>  
  <p style="margin-top: 30px; font-weight: bold; font-size: 15px;">
    coletamos as promoções mais quentes da internet para você! 🔥🛒<br/> 
  </p>  
  <!-- <p><a class="button" href="/ai">Ir para integração IA</a></p> -->

  <!-- Botões de ordenação -->
  <div class="sort-buttons" style="text-align: center; margin: 20px 0;">
    <button class="sort-btn" onclick="sortProducts('price-asc')">💰 Mais Baratos!</button>
    <button class="sort-btn" onclick="sortProducts('price-desc')">💸 Mais Caros!</button>
    <button class="sort-btn" onclick="sortProducts('discount')">🔥 Maior Desconto!</button>
  </div>

  <div class="grid" id="products-container"></div>
  <script>
    const FALLBACK_IMG = "/media/fallbacks/aa.png";

    function createProductCard(product) {
      const card = document.createElement("div");
      card.className = "card";

      const carousel = document.createElement("div");
      carousel.className = "carousel";
      carousel.dataset.index = 0;

      product.images.forEach((img, idx) => {
        const imgEl = document.createElement("img");
        if (img.startsWith("/media/")) {
          imgEl.src = img;
        } else {
          try {
            const url = new URL(img, window.location.origin);
            const parts = url.pathname.split("/").filter(Boolean);
            const bucket = parts[0];
            const filename = parts.slice(1).join("/");
            imgEl.src = `/media/${bucket}/${filename}`;
          } catch (e) {
            console.warn("URL inválida:", img);
            imgEl.src = FALLBACK_IMG;
          }
        }

        imgEl.alt = product.title;
        imgEl.className = "carousel-image" + (idx === 0 ? "" : " hidden");
        imgEl.onerror = () => imgEl.src = FALLBACK_IMG;
        carousel.appendChild(imgEl);
      });

      if (product.images.length > 1) {
        const btnPrev = document.createElement("button");
        btnPrev.innerHTML = "‹";
        btnPrev.className = "carousel-btn left";
        btnPrev.onclick = () => prevImage(btnPrev);

        const btnNext = document.createElement("button");
        btnNext.innerHTML = "›";
        btnNext.className = "carousel-btn right";
        btnNext.onclick = () => nextImage(btnNext);

        carousel.appendChild(btnPrev);
        carousel.appendChild(btnNext);
      }

      const overlay = document.createElement("div");
      overlay.className = "overlay";

      const title = document.createElement("div");
      title.className = "title";
      title.innerText = product.title;

      const price = document.createElement("span");
      price.className = "price";
      price.innerText = product.price;

      const oldPrice = document.createElement("span");
      oldPrice.className = "old-price";
      oldPrice.innerText = product.oldPrice || "";

      const discount = document.createElement("span");
      discount.className = "discount";
      if (product.oldPrice && parseFloat(product.oldPrice.replace("R$", "").replace(",", ".")) > parseFloat(product.price.replace("R$", "").replace(",", "."))) {
        const discountVal = Math.round((1 - parseFloat(product.price.replace("R$", "").replace(",", ".")) / parseFloat(product.oldPrice.replace("R$", "").replace(",", "."))) * 100);
        discount.innerText = discountVal + "% de desconto!";
      }

      overlay.appendChild(title);
      overlay.appendChild(price);
      overlay.appendChild(oldPrice);
      if (discount.innerText) overlay.appendChild(discount);

      const link = document.createElement("a");
      link.href = product.link;
      link.target = "_blank";
      link.className = "button";
      link.innerText = "Ver Produto";

      const siteLabel = document.createElement("div");
      siteLabel.className = "site-label";
      siteLabel.innerText = "🌐 " + product.bucketName || "Bucket";
      siteLabel.style.textAlign = "center";
      siteLabel.style.fontSize = "12px";
      siteLabel.style.color = "#aaa";

      

      card.appendChild(carousel);
      card.appendChild(overlay);
      card.appendChild(siteLabel);  // Adiciona o nome do bucket
      card.appendChild(link);

      return card;
    }

    function nextImage(btn) {
      const carousel = btn.closest(".carousel");
      const images = carousel.querySelectorAll(".carousel-image");
      let index = parseInt(carousel.dataset.index);
      images[index].classList.add("hidden");
      index = (index + 1) % images.length;
      images[index].classList.remove("hidden");
      carousel.dataset.index = index;
    }

    function prevImage(btn) {
      const carousel = btn.closest(".carousel");
      const images = carousel.querySelectorAll(".carousel-image");
      let index = parseInt(carousel.dataset.index);
      images[index].classList.add("hidden");
      index = (index - 1 + images.length) % images.length;
      images[index].classList.remove("hidden");
      carousel.dataset.index = index;
    }

    let allProducts = []; // Variável global para armazenar todos os produtos

    function getNumericPrice(priceStr) {
      return parseFloat(priceStr.replace("R$", "").replace(",", ".").trim());
    }

    function getDiscountPercentage(product) {
      if (!product.oldPrice || product.oldPrice === product.price) return 0;
      const oldPrice = getNumericPrice(product.oldPrice);
      const currentPrice = getNumericPrice(product.price);
      if (oldPrice > currentPrice) {
        return Math.round((1 - currentPrice / oldPrice) * 100);
      }
      return 0;
    }

    function sortProducts(type) {
      // Remove active class de todos os botões
      document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
      
      // Adiciona active class ao botão clicado
      event.target.classList.add('active');

      let sortedProducts = [...allProducts];
      
      switch(type) {
        case 'price-asc':
          sortedProducts.sort((a, b) => getNumericPrice(a.price) - getNumericPrice(b.price));
          break;
        case 'price-desc':
          sortedProducts.sort((a, b) => getNumericPrice(b.price) - getNumericPrice(a.price));
          break;
        case 'discount':
          sortedProducts.sort((a, b) => getDiscountPercentage(b) - getDiscountPercentage(a));
          break;
      }
      
      // Limpa o container e adiciona produtos ordenados
      const container = document.getElementById("products-container");
      container.innerHTML = '';
      sortedProducts.forEach(product => {
        const card = createProductCard(product);
        container.appendChild(card);
      });
    }

    fetch("/api/products", {
      headers: {
        "ngrok-skip-browser-warning": "true"
      }
    })
    .then(res => res.json())
    .then(products => {
      allProducts = products; // Armazena os produtos globalmente
      const container = document.getElementById("products-container");
      products.forEach(p => {
        const card = createProductCard(p);
        container.appendChild(card);
      });
    })
    .catch(err => {
      console.error("Erro ao carregar produtos:", err);
    });
  </script>
</body>
</html>
