services:
  site:
    build: ./services/site
    container_name: site-dev
    environment:
      - FLASK_ENV=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://user:password@db:5432/produtos_db
    env_file: .env
    volumes:
      - ./services/site:/app
    networks:
      - backend
    command: ["python", "main.py"]
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: produtos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
