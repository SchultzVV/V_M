version: "3.9"

services:
  site:
    build:
      context: ./services/site
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements-dev.txt
    container_name: site
    environment:
      - FLASK_ENV=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://user:password@db:5432/produtos_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
    env_file: .env
    volumes:
      - ./services/site:/app
      - ./uploads:/app/../uploads
    command: ["python", "main.py"]
    depends_on:
      - db
      - minio
      - hsmart
    ports:
      - "5555:5000"
    networks:
      - backend

  db:
    image: postgres:15
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: produtos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  vector_db:
    image: qdrant/qdrant
    container_name: vector_db
    ports:
      - "6333:6333"
    volumes:
      - ./vector_db:/qdrant/storage
    restart: always
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    networks:
      - backend

  hsmart:
    image: ghcr.io/schultzvv/hsmart:latest
    container_name: hsmart
    ports:
      - "5005:5005"
    depends_on:
      - vector_db
      - redis
      - ollama
    restart: always
    env_file: .env
    environment:
      - QDRANT_HOST=vector_db
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
      - LLM_PROVIDER=ollama
      - DEBUG=${DEBUG}
    networks:
      - backend

volumes:
  pgdata:
  minio_data:
  ollama_data:

networks:
  backend:
    driver: bridge
