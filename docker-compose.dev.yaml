version: "3.9"

services:
  site:
    build:
      context: ./services/site
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements-dev.txt
    container_name: site-dev
    environment:
      - FLASK_ENV=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://user:password@db:5432/produtos_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
    env_file: .env
    volumes:
      - ./services/site:/app
      - ./cert.pem:/app/cert.pem
      - ./key.pem:/app/key.pem
    command: ["python", "main.py"]
    depends_on:
      - db
      - minio
      - ingestion_service
      - retrieval_service
    ports:
      - "5000:5000"
    networks:
      - backend

  db:
    image: postgres:15
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: produtos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  vector_db:
    image: qdrant/qdrant
    container_name: vector_db
    ports:
      - "6333:6333"
    volumes:
      - ./vector_db:/qdrant/storage
    restart: always
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - backend

  ingestion_service:
    image: ghcr.io/schultzvv/hsmart-ingestion_service:latest
    container_name: ingestion_service
    ports:
      - "5003:5003"
    volumes:
      - ./shared:/app/shared
    depends_on:
      - vector_db
      - redis
    restart: always
    env_file: .env
    environment:
      - DEBUG=${DEBUG}
    networks:
      - backend

  retrieval_service:
    image: ghcr.io/schultzvv/hsmart-retrieval_service:latest
    container_name: retrieval_service
    ports:
      - "5004:5004"
    volumes:
      - ./shared:/app/shared
    depends_on:
      - vector_db
      - redis
    restart: always
    env_file: .env
    environment:
      - DEBUG=${DEBUG}
    networks:
      - backend

volumes:
  pgdata:
  minio_data:

networks:
  backend:
    driver: bridge
