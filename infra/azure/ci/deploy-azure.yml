# ============================================================
# Exemplo de workflow (copie para .github/workflows/deploy-azure.yml).
# Login por OIDC (cicd.tf) → build das 2 imagens → push no GHCR →
# atualiza o Container App (2 containers) e todos os jobs com a tag = SHA.
# Secrets do repo: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (output github_oidc). GITHUB_TOKEN já tem write:packages no GHCR.
# ============================================================
name: Deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read
  packages: write   # GHCR

env:
  RG: rg-def-prd
  WEB_APP: ca-def-prd-web
  IMAGE_SITE: ghcr.io/${{ github.repository_owner }}/def-site
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/def-web
  TAG: ${{ github.sha }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) base = Dockerfile atual do Flask (py3.10 + Playwright) com requirements-prd
      - name: Build base
        uses: docker/build-push-action@v6
        with:
          context: services/site
          file: services/site/Dockerfile
          build-args: REQUIREMENTS=requirements-prd.txt
          tags: def-site:base
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) site = base + gunicorn (infra/docker/Dockerfile.site)
      - name: Build & push site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.site
          build-args: BASE_IMAGE=def-site:base
          push: true
          tags: |
            ${{ env.IMAGE_SITE }}:${{ env.TAG }}
            ${{ env.IMAGE_SITE }}:latest

      # 3) web = React build + nginx (infra/docker/Dockerfile.web)
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ env.TAG }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update web (2 containers)
        run: |
          az containerapp update -g "$RG" -n "$WEB_APP" --container-name site --image "$IMAGE_SITE:$TAG"
          az containerapp update -g "$RG" -n "$WEB_APP" --container-name web  --image "$IMAGE_WEB:$TAG"

      - name: Update jobs
        run: |
          for j in $(az containerapp job list -g "$RG" --query "[?starts_with(name,'caj-def-prd-')].name" -o tsv); do
            az containerapp job update -g "$RG" -n "$j" --image "$IMAGE_SITE:$TAG"
          done

      # Alternativa: manter o Terraform como fonte de verdade
      # - run: terraform -chdir=infra/azure init -backend-config=backend.hcl && terraform -chdir=infra/azure apply -auto-approve -var image_tag=$TAG
