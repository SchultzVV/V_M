# Exemplo de GitHub Actions para o GCP. Copie para .github/workflows/deploy-gcp.yml
# Segredos/variáveis do repositório (Settings → Secrets and variables → Actions):
#   vars.GCP_PROJECT_ID, vars.GCP_REGION, vars.GCP_WIF_PROVIDER (output wif_provider),
#   vars.GCP_DEPLOY_SA (output service_accounts.deploy)
# Sem chave JSON: autenticação por Workload Identity Federation (OIDC).
name: deploy-gcp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/def
  PREFIX: def-prd

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # 1) imagem base atual (Playwright) → 2) camada gunicorn → 3) nginx + React
      - name: build def-site:base
        run: |
          docker build \
            --build-arg REQUIREMENTS=requirements-prd.txt \
            -t def-site:base services/site

      - name: build & push def-site
        run: |
          docker build -f infra/docker/Dockerfile.site --build-arg BASE_IMAGE=def-site:base \
            -t $REGISTRY/def-site:${{ steps.meta.outputs.tag }} -t $REGISTRY/def-site:latest .
          docker push --all-tags $REGISTRY/def-site

      - name: build & push def-web
        run: |
          docker build -f infra/docker/Dockerfile.web \
            -t $REGISTRY/def-web:${{ steps.meta.outputs.tag }} -t $REGISTRY/def-web:latest .
          docker push --all-tags $REGISTRY/def-web

  rollout:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Opção A (padrão): só troca a imagem; o Terraform continua dono do resto.
      # Rode depois `terraform apply -var image_tag=<tag>` localmente para alinhar o estado,
      # ou mantenha image_tag=latest no tfvars e ignore o diff da imagem.
      - name: update web service
        run: |
          TAG=${{ needs.build-push.outputs.tag }}
          gcloud run services update $PREFIX-web --region ${{ vars.GCP_REGION }} \
            --container web  --image $REGISTRY/def-web:$TAG \
            --container site --image $REGISTRY/def-site:$TAG

      - name: update jobs
        run: |
          TAG=${{ needs.build-push.outputs.tag }}
          for job in $(gcloud run jobs list --region ${{ vars.GCP_REGION }} --format='value(name)' --filter="name~^$PREFIX-"); do
            gcloud run jobs update "$job" --region ${{ vars.GCP_REGION }} \
              --container site --image $REGISTRY/def-site:$TAG
          done

      # Opção B: terraform apply no CI (a SA de deploy precisaria de roles/editor+;
      # preferimos manter o apply na máquina do operador).
