# Workflow def-<env>-run-job
# Disparado pelo Eventarc quando chega mensagem no tópico Pub/Sub def-<env>-events.
# Mensagem (JSON, base64 pelo Pub/Sub):
#   {"job": "api-update-ml", "args": ["scripts/api_update_ml.py", "https://meli.la/xxx"]}
# Executa o Cloud Run Job <JOB_PREFIX>-<job> com os args sobrescritos e espera terminar.
# Variáveis de ambiente (user_env_vars): REGION, JOB_PREFIX, ALLOWED_JOBS (JSON list).
main:
  params: [event]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("REGION")}
          - prefix: ${sys.get_env("JOB_PREFIX")}
          - allowed: ${json.decode(sys.get_env("ALLOWED_JOBS"))}
    - decode:
        assign:
          - payload: ${json.decode(text.decode(base64.decode(event.data.message.data)))}
          - job: ${payload.job}
          - args: ${default(map.get(payload, "args"), [])}
    - check_job:
        switch:
          - condition: ${not (job in allowed)}
            raise: ${"job não permitido: " + job}
    - log_start:
        call: sys.log
        args:
          severity: INFO
          text: ${"executando " + prefix + "-" + job + " args=" + json.encode_to_string(args)}
    - run_job:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + prefix + "-" + job}
          body:
            overrides:
              containerOverrides:
                - name: site
                  args: ${args}
          connector_params:
            timeout: 3600
        result: execution
    - log_done:
        call: sys.log
        args:
          severity: INFO
          text: ${"concluído " + prefix + "-" + job}
    - done:
        return: ${execution}
