# Workflow def-<env>-nightly
# Disparado pelo Cloud Scheduler (nightly_cron). Executa em sequência os jobs
# de NIGHTLY_JOBS (JSON list, ex.: ["update-ml-prices","verify-prices","tag-classify"]),
# esperando cada um terminar; um job com falha é registrado e a sequência continua.
main:
  params: [input]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("REGION")}
          - prefix: ${sys.get_env("JOB_PREFIX")}
          - jobs: ${json.decode(sys.get_env("NIGHTLY_JOBS"))}
          - results: {}
    - run_each:
        for:
          value: job
          in: ${jobs}
          steps:
            - log_start:
                call: sys.log
                args:
                  severity: INFO
                  text: ${"nightly: executando " + prefix + "-" + job}
            - run_job:
                try:
                  steps:
                    - call_run:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + prefix + "-" + job}
                          connector_params:
                            timeout: 3600
                        result: execution
                    - ok:
                        assign:
                          - results[job]: "ok"
                except:
                  as: e
                  steps:
                    - log_err:
                        call: sys.log
                        args:
                          severity: ERROR
                          text: ${"nightly: falha em " + job + ": " + json.encode_to_string(e)}
                    - failed:
                        assign:
                          - results[job]: "falhou"
    - done:
        return: ${results}
