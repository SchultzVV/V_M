services:
  - type: web
    name: vm-site
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    startCommand: "python main.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MINIO_ENDPOINT
      - key: MINIO_ACCESS_KEY
      - key: MINIO_SECRET_KEY
      - key: POSTGRES_URI
