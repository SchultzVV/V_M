version: "3.8"

services:
  site:
    image: ghcr.io/<seu_usuario_github>/site:latest
    env_file: .env.prd
    restart: unless-stopped
    ports:
      - "80:5000"
    depends_on:
      - db
      - minio

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: produtos_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: always
    user: "0"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DATA_DIR: /data
      MINIO_BROWSER: "on"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data:
