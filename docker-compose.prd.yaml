version: "3.8"
services:
  site:
    image: ghcr.io/<seu_usuario_github>/site:latest
    env_file: .env.prd
    restart: unless-stopped
    ports:
      - "80:5000"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: produtos_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
