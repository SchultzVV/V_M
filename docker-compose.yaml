version: "3.8"
services:
  site:
    build: ./services/site
    container_name: site
    env_file: .env
    volumes:
      - ./services/site:/app
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - backend

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: produtos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
