services:
  site:
    build: ./services/site
    container_name: site
    env_file: .env
    volumes:
      - ./services/site:/app
    ports:
      - "5000:5000"
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  minio_data:
