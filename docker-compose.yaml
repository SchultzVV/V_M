version: "3.8"

services:
  site:
    build:
      context: ./services/site
      dockerfile: Dockerfile
    container_name: site
    env_file: .env
    volumes:
      - ./services/site:/app
      - ./certs/localhost.crt:/app/cert.pem:ro
      - ./certs/localhost.key:/app/key.pem:ro
    ports:
      - "5555:5000"
    depends_on:
      - db
      - minio
      - redis
    networks:
      - backend

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: produtos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  minio:
    # minio/minio sumiu do Docker Hub e do quay.io (MinIO virou source-only em 2025).
    # bitnamilegacy/minio e a ultima imagem pronta; o entrypoint Bitnami ja roda
    # `minio server` (nao usar `command`). user 0 so para o entrypoint fazer chown
    # do volume antigo (criado como root) e depois rodar como 1001.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    user: "0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DATA_DIR: /data
      MINIO_BROWSER: "on"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - backend
    restart: always

  info-scrap:
    image: ghcr.io/schultzvv/info_scrap:latest
    container_name: info-scrap
    ports:
      - "8001:8000"
    networks:
      - backend
    restart: always

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  minio_data:
  redis_data:
