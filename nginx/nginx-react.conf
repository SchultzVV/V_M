# ============================================================
# Nginx configuration for React frontend + Flask backend proxy
# Serves static React files + proxies /api/* to Flask backend
# ============================================================

upstream flask_backend {
    server site:5000;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # SSL certificates (self-signed for dev)
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json text/javascript;
    gzip_comp_level 6;
    gzip_vary on;

    # Client upload limit
    client_max_body_size 50M;

    # Root for React static files
    root /app/dist;

    # ============================================================
    # 1. API Proxy Routes → Flask Backend
    # ============================================================

    location /api/ {
        proxy_pass https://flask_backend;
        proxy_ssl_verify off;
        
        # Preserve original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass https://flask_backend;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /webhook/ {
        proxy_pass https://flask_backend;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================================
    # 2. Static Assets (React compiled files)
    # ============================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Cache static assets for 1 year
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================================
    # 3. React SPA Routing (fallback to index.html)
    # ============================================================

    location / {
        # First check if file exists
        try_files $uri $uri/ /index.html;
        
        # Cache index.html for short time (so updates are picked up)
        add_header Cache-Control "public, max-age=3600";
        add_header X-Served-By "nginx-react" always;
    }

    # ============================================================
    # 4. Security headers
    # ============================================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    # 5. Logging
    # ============================================================

    access_log /var/log/nginx/react_access.log;
    error_log /var/log/nginx/react_error.log;
}
