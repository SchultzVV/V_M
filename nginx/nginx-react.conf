# ============================================================
# Nginx configuration for React frontend + Flask backend proxy
# Serves static React files + proxies /api/*, /auth/*, /webhook/* to Flask
# OPÇÃO B: Nginx como reverse proxy único com health checks
# ============================================================

# ============================================================
# Upstream: Flask Backend with health monitoring
# ============================================================
upstream flask_backend {
    server site:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# ============================================================
# HTTP → HTTPS redirect
# ============================================================
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# ============================================================
# Main HTTPS server block
# ============================================================
server {
    listen 443 ssl http2;
    server_name localhost;

    # ============================================================
    # SSL Configuration (self-signed for development)
    # ============================================================
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================================
    # Compression & Performance
    # ============================================================
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1000;

    # ============================================================
    # Upload limit & Timeouts
    # ============================================================
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # ============================================================
    # Root directory for React static files
    # ============================================================
    root /app/dist;

    # ============================================================
    # 1. HEALTH CHECK endpoint (must be before proxy blocks)
    # ============================================================
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # 2. API Proxy Routes → Flask Backend
    # ============================================================
    location /api/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        
        # Preserve original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        
        # Timeouts (longer for API calls)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location /auth/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location /webhook/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # ============================================================
    # 3. Static Assets (React compiled files) with caching
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header ETag $request_time;
        access_log off;
        try_files $uri =404;
    }

    # ============================================================
    # 4. React SPA Routing (fallback to index.html)
    # ============================================================
    location / {
        # Try file, then directory, then fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;
        
        # Short cache for index.html (so updates are picked up)
        add_header Cache-Control "public, max-age=3600";
        add_header X-Served-By "nginx-react";
    }

    # ============================================================
    # 5. Error pages
    # ============================================================
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ============================================================
    # 6. Security Headers
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================================
    # 7. Logging
    # ============================================================
    access_log /var/log/nginx/react_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/react_error.log warn;
}

